<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>autocomplete Example</title>
  <base target="_blank">
  <link rel="stylesheet" href="base-styles.css">
</head>

<body>
  <h2>Attribute 2: autocomplete</h2>
  <form>
    <label for="recovery-email">Enter your recovery email</label>
    <input
      type="email"
      id="recovery-email"
      name="recoveryEmail"
      autocomplete="email"
      placeholder="yourname@example.com"
      required
    >
  </form>

  <section>
    <h3>Useful Links:</h3>
    <div><a href="https://developer.mozilla.org/en-US/docs/Web/HTML/Attributes/autocomplete">MDN Documentation</a></div>
    <div><a href="https://www.w3schools.com/tags/att_input_autocomplete.asp">w3schools Guide</a></div>
  </section>
</body>

</html>
